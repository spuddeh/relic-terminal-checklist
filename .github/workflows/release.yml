name: Release

# CANONICAL COPY: MyMods/_shared/release/release.yml
# Copied verbatim into every mod repo that publishes to Nexus. It is artifact-agnostic —
# release-manifest.json drives it — so the copies MUST stay byte-identical. They drifted once
# (NCZoningCore's copy carried the "file_id does not exist until the first manual upload"
# caveat and the other six did not), which is how a shared file loses the one thing worth
# knowing about it. Edit here, then redeploy to each consumer.
#
# Publishes a single artifact (the main mod, or one preset) to GitHub Releases and Nexus Mods.
# Trigger by publishing a GitHub Release whose tag follows "<artifact>-v<version>"
# (e.g. slm-v1.6.0, konpeki-v1.1.0). The artifact id must exist in release-manifest.json.
# See RELEASING.md.
#
# What lands on Nexus, and what still does not:
#   - the FILE      — the zip, its version, display name, category and description.
#   - the PAGE version — only for artifacts with "update_mod_version": true in the manifest.
#   - the PAGE changelog — appended from the release body (see the split step below).
#   - the PAGE description is still MANUAL. No endpoint here touches it.
#
# THE FIRST NEXUS UPLOAD MUST BE DONE BY HAND. A file_id does not exist until a file has been
# uploaded to the mod page once — so this workflow can publish a mod's UPDATES, never its first
# file. Until the id is set it hard-fails rather than uploading into the void.
#
# Backfilled/historical releases created by scripts/backfill-releases.ps1 carry an invisible
# "<!-- skip-nexus -->" marker in their body and are skipped here (they are already on Nexus,
# and they attach their true historical zip rather than a rebuild).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      artifact:
        description: "Artifact id from release-manifest.json (e.g. slm, konpeki, jnve)"
        required: true
      version:
        description: "Version string (e.g. 1.6.0)"
        required: true
      tag:
        description: "Existing release tag to attach the zip to (optional; leave blank to skip GitHub asset upload)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    # Skip backfilled/manual GitHub-only releases (marked invisibly in the body).
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.release.body, '<!-- skip-nexus -->') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve artifact and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ART="${{ github.event.inputs.artifact }}"
            VER="${{ github.event.inputs.version }}"
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
            # Split on the first "-v": "<artifact>-v<version>"
            ART="${TAG%%-v*}"
            VER="${TAG#*-v}"
          fi
          if [ -z "$ART" ] || [ -z "$VER" ]; then
            echo "::error::Could not resolve artifact/version (tag '$TAG'). Expected '<artifact>-v<version>'."
            exit 1
          fi
          echo "artifact=$ART" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved artifact='$ART' version='$VER' tag='$TAG'"

      # The Nexus file id lives in a REPOSITORY VARIABLE, not in the repo.
      #
      #   Variable name:  NEXUS_FILE_ID_<ARTIFACT>   (uppercased, '-' -> '_')
      #   e.g. artifact "slm" -> NEXUS_FILE_ID_SLM ; "sprintware" -> NEXUS_FILE_ID_SPRINTWARE
      #
      # A VARIABLE, not a secret: the id is public (it is printed on the mod page), and masking it
      # would only make a bad id harder to debug. It lives outside the repo because it does not
      # exist until the first manual upload, so committing a placeholder means committing a lie.
      #
      # release-manifest.json's `file_id` is still honoured as a FALLBACK, so repos that have not
      # migrated keep working. The variable wins where both are set.
      - name: Resolve Nexus file_id (repo variable first, manifest as fallback)
        id: fid
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          ART: ${{ steps.meta.outputs.artifact }}
        run: |
          KEY="NEXUS_FILE_ID_$(printf '%s' "$ART" | tr '[:lower:]' '[:upper:]' | tr -c 'A-Z0-9' '_' )"
          KEY="${KEY%_}"
          FROM_VAR="$(printf '%s' "$VARS_JSON" | jq -r --arg k "$KEY" '.[$k] // empty')"
          FROM_MANIFEST="$(jq -r --arg a "$ART" '.artifacts[$a].file_id // empty' release-manifest.json)"

          if [ -n "$FROM_VAR" ]; then
            FILEID="$FROM_VAR"; SRC="repository variable $KEY"
          else
            FILEID="$FROM_MANIFEST"; SRC="release-manifest.json (fallback)"
          fi

          if [ -z "$FILEID" ] || echo "$FILEID" | grep -q "REPLACE_WITH"; then
            echo "::error::No Nexus file_id for artifact '$ART'."
            echo "::error::A file_id DOES NOT EXIST until the mod's first file has been uploaded to Nexus BY HAND."
            echo "::error::Upload that first file manually, then read the id off the mod page (Files tab > API Info —"
            echo "::error::Nexus labels it 'Group ID'), and set the repository variable '$KEY'"
            echo "::error::(Settings > Secrets and variables > Actions > Variables). Do NOT use the file_id from the"
            echo "::error::public v1 API — that is a different id space and the wrong value looks entirely plausible."
            exit 1
          fi
          echo "Using file_id from $SRC"
          echo "file_id=$FILEID" >> "$GITHUB_OUTPUT"

      - name: Look up artifact in manifest
        id: art
        run: |
          ART='${{ steps.meta.outputs.artifact }}'
          if ! jq -e --arg a "$ART" '.artifacts[$a]' release-manifest.json >/dev/null; then
            echo "::error::Artifact '$ART' not found in release-manifest.json"
            exit 1
          fi
          get() { jq -r --arg a "$ART" ".artifacts[\$a].$1 // empty" release-manifest.json; }
          # contentDir / installDir: a string each, or two matched arrays for a payload of
          # several top-level game trees (r6 + bin). A single contentDir silently drops every
          # tree it does not contain - the zip still builds, installs, and looks complete.
          CONTENTS="$(jq -c --arg a "$ART" '[.artifacts[$a].contentDir // empty] | flatten' release-manifest.json)"
          INSTALLS="$(jq -c --arg a "$ART" '[.artifacts[$a].installDir // empty] | flatten' release-manifest.json)"
          N="$(jq length <<<"$CONTENTS")"
          if [ "$N" -eq 0 ]; then
            echo "::error::contentDir for artifact '$ART' is not set."
            exit 1
          fi
          if [ "$(jq length <<<"$INSTALLS")" -ne "$N" ]; then
            echo "::error::contentDir and installDir for '$ART' must pair up one to one."
            exit 1
          fi
          i=0
          while [ "$i" -lt "$N" ]; do
            C="$(jq -r ".[$i]" <<<"$CONTENTS")"
            I="$(jq -r ".[$i]" <<<"$INSTALLS")"
            if [ -z "$C" ] || [ ! -d "$C" ]; then
              echo "::error::contentDir '$C' for artifact '$ART' is missing."
              exit 1
            fi
            if [ -z "$I" ] || [ "$I" = "null" ]; then
              echo "::error::installDir for artifact '$ART' (entry $i) is not set."
              exit 1
            fi
            i=$((i+1))
          done
          BASENAME="$(get fileBaseName)"
          [ -z "$BASENAME" ] && BASENAME="$ART"   # fall back to the artifact id
          {
            echo "content_dirs=$CONTENTS"
            echo "install_dirs=$INSTALLS"
            echo "category=$(get category)"
            echo "display_name=$(get displayName)"
            echo "file_base_name=$BASENAME"
            echo "primary=$(jq -r --arg a "$ART" '.artifacts[$a].primary_mod_manager_download // false' release-manifest.json)"
            echo "show_reqs=$(jq -r --arg a "$ART" '.artifacts[$a].show_requirements_pop_up // true' release-manifest.json)"
            echo "update_mod_version=$(jq -r --arg a "$ART" '.artifacts[$a].update_mod_version // false' release-manifest.json)"
            echo "nexus_mod_id=$(jq -r --arg a "$ART" '.artifacts[$a].nexus_mod_id // empty' release-manifest.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Build zip
        id: zip
        run: |
          ZIP="${{ steps.art.outputs.file_base_name }}_v${{ steps.meta.outputs.version }}.zip"
          CONTENTS='${{ steps.art.outputs.content_dirs }}'
          INSTALLS='${{ steps.art.outputs.install_dirs }}'
          # Stage every content tree into its in-game install path, then zip the stage so the
          # install paths ("bin/...", "r6/...", ...) sit at the zip root exactly as the game expects.
          STAGE="$(mktemp -d)"
          N="$(jq length <<<"$CONTENTS")"
          i=0
          while [ "$i" -lt "$N" ]; do
            C="$(jq -r ".[$i]" <<<"$CONTENTS")"
            I="$(jq -r ".[$i]" <<<"$INSTALLS")"
            mkdir -p "$STAGE/$I"
            cp -r "$C/." "$STAGE/$I/"
            i=$((i+1))
          done
          ( cd "$STAGE" && zip -r -X "$GITHUB_WORKSPACE/$ZIP" . -x '*/.git/*' '*/.DS_Store' )
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Built $ZIP:"
          unzip -l "$ZIP"

      - name: Attach zip to GitHub release
        if: ${{ github.event_name == 'release' || github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.meta.outputs.tag }}" "${{ steps.zip.outputs.zip }}" --clobber

      # The release body feeds TWO different Nexus fields, split by one marker:
      #
      #   <text>                              -> the mod page CHANGELOG entry (no marker case)
      #   <text> <!-- nexus-description-end --> <text>
      #      ^ the FILE description (<=255 chars)   ^ the mod page CHANGELOG entry
      #
      # The file description is opt-in and capped at 255 chars; over that it is truncated at a word
      # boundary as a safety net (with a warning). The changelog is whatever is left.
      #
      # THE CHANGELOG ENDPOINT APPENDS, IT DOES NOT REPLACE. Posting the same version twice leaves
      # the text on the page twice, and there is no delete from here. So the changelog is sent ONLY
      # on a `release: published` event, never on a workflow_dispatch — a dispatch is by definition
      # a re-run, and a re-run must not double-post. Republishing a release re-fires the event and
      # WILL double-post; edit the page by hand in that case.
      #
      # It is also sent only by an artifact whose `update_mod_version` is true. A changelog entry is
      # keyed to a version string, so an artifact that does not set the page's version has no version
      # to key one to: an SLM preset would file its entry on the SLM page under '1.0.0kp'.
      - name: Split release body into file description and mod changelog
        id: desc
        env:
          BODY: ${{ github.event.release.body }}
          EVENT: ${{ github.event_name }}
          OWNS_PAGE: ${{ steps.art.outputs.update_mod_version }}
        run: |
          MARKER='<!-- nexus-description-end -->'
          # strip HTML comments, then trim leading/trailing blank lines
          clean() { sed 's/<!--[^>]*-->//g' | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac; }

          DESC=""
          if printf '%s' "$BODY" | grep -qF "$MARKER"; then
            DESC="$(printf '%s' "$BODY" | awk -v m="$MARKER" '{i=index($0,m); if(i){if(i>1)print substr($0,1,i-1); exit} print}' | clean)"
            CHANGELOG="$(printf '%s\n' "$BODY" | awk -v m="$MARKER" 'index($0,m){f=1; next} f' | clean)"
          else
            CHANGELOG="$(printf '%s\n' "$BODY" | clean)"
          fi

          if [ -n "$DESC" ]; then
            if [ "$(printf '%s' "$DESC" | wc -m)" -gt 255 ]; then
              DESC="$(printf '%s' "$DESC" | cut -c1-250)"
              DESC="${DESC% *}…"
              echo "::warning::Nexus file description exceeded 255 chars; truncated at a word boundary. Shorten the text before '$MARKER'."
            fi
            echo "Nexus file description set ($(printf '%s' "$DESC" | wc -m) chars)."
          else
            echo "No '$MARKER' content found; leaving the Nexus file description unset."
          fi

          if [ "$EVENT" != "release" ]; then
            echo "Event is '$EVENT', not 'release'; not posting a changelog (the endpoint appends, so a re-run would duplicate it)."
            CHANGELOG=""
          elif [ "$OWNS_PAGE" != "true" ]; then
            echo "This artifact does not own its mod page (update_mod_version is not true); not posting a changelog."
            CHANGELOG=""
          elif [ -n "$CHANGELOG" ]; then
            echo "Nexus changelog set ($(printf '%s' "$CHANGELOG" | wc -m) chars)."
          else
            echo "Release body is empty after the split; no changelog to post."
          fi

          { echo "value<<__DESC_EOF__"; printf '%s\n' "$DESC"; echo "__DESC_EOF__"; } >> "$GITHUB_OUTPUT"
          { echo "changelog<<__CL_EOF__"; printf '%s\n' "$CHANGELOG"; echo "__CL_EOF__"; } >> "$GITHUB_OUTPUT"

      # The changelog endpoint wants the mod's INTERNAL id, which is NOT the number in the mod page
      # URL. release-manifest.json's `nexus_mod_id` is the URL number (the API calls it
      # `game_scoped_id`); the internal id is the `data.id` you get back from looking that number up.
      # Two different id spaces, same trap as the file_id — so it is resolved here at release time
      # rather than stored, because a stored copy of the wrong one looks entirely plausible.
      #
      # This WARNS and skips rather than failing: by the time it runs the file has already uploaded
      # successfully, and a missing changelog is a page edit, not a broken release.
      - name: Resolve Nexus mod id for the changelog
        id: modid
        if: ${{ steps.desc.outputs.changelog != '' }}
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          SCOPED: ${{ steps.art.outputs.nexus_mod_id }}
        run: |
          skip() { echo "::warning::$1 Skipping the Nexus changelog; add it to the mod page by hand."; echo "mod_id=" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ -z "$SCOPED" ] || printf '%s' "$SCOPED" | grep -q "REPLACE_WITH"; then
            skip "No usable 'nexus_mod_id' in release-manifest.json for this artifact."
          fi

          RESP="$(curl -sS -w '\n%{http_code}' -H "apikey: $NEXUS_API_KEY" -H "Accept: application/json" \
                    "https://api.nexusmods.com/v3/games/cyberpunk2077/mods/$SCOPED")" || skip "Mod lookup for '$SCOPED' failed to connect."
          CODE="$(printf '%s' "$RESP" | tail -n1)"
          PAYLOAD="$(printf '%s' "$RESP" | sed '$d')"
          if [ "$CODE" != "200" ]; then
            skip "Mod lookup for game-scoped id '$SCOPED' returned HTTP $CODE."
          fi

          MODID="$(printf '%s' "$PAYLOAD" | jq -r '.data.id // empty')"
          if [ -z "$MODID" ]; then
            skip "Mod lookup for '$SCOPED' returned no 'data.id'."
          fi
          echo "Resolved mod page $SCOPED to mod id $MODID"
          echo "mod_id=$MODID" >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.fid.outputs.file_id }}
          filename: ${{ steps.zip.outputs.zip }}
          version: ${{ steps.meta.outputs.version }}
          display_name: ${{ steps.art.outputs.display_name }}
          description: ${{ steps.desc.outputs.value }}
          category: ${{ steps.art.outputs.category }}
          archive_existing_version: true
          allow_mod_manager_download: true
          primary_mod_manager_download: ${{ steps.art.outputs.primary }}
          show_requirements_pop_up: ${{ steps.art.outputs.show_reqs }}
          # Sets the mod PAGE's headline version to this file's version. Per-artifact, because an
          # artifact can be one file among several on a shared page: a preset carries its own
          # suffixed version (1.0.0kp) and must never stamp that onto the page. Absent key => false.
          update_mod_version: ${{ steps.art.outputs.update_mod_version }}
          # Both or neither: the action hard-fails on a changelog with no mod_id, and the resolve
          # step deliberately returns an empty id rather than failing, so blank the text to match.
          mod_id: ${{ steps.modid.outputs.mod_id }}
          changelog: ${{ steps.modid.outputs.mod_id != '' && steps.desc.outputs.changelog || '' }}
